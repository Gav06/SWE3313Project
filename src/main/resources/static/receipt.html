<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Piero's Pizzeria - Receipt</title>
    <style>
        body {
            font-family: 'Gabriola', 'Cormorant Garamond', serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .titleDiv {
            border: 5px outset #d32f2f;
            background-color: white;
            text-align: center;
            padding: 20px;
            margin-bottom: 0;
        }
        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px 20px;
            background-color: white;
            border-left: 5px outset #d32f2f;
            border-right: 5px outset #d32f2f;
            border-bottom: 5px outset #d32f2f;
            margin-bottom: 30px;
        }
        .button {
            border: 2px outset #d32f2f;
            color: black;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
            transition: background-color 0.3s;
            white-space: nowrap;
            border-radius: 5px;
            font-family: 'Gabriola', 'Cormorant Garamond', serif;
        }
        .button:hover {
            background-color: #f0f0f0;
        }
        .receipt-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 40px;
            border: 3px solid red;
            border-radius: 8px;
        }
        .receipt-header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #d32f2f;
            padding-bottom: 20px;
        }
        .receipt-header h1 {
            color: #d32f2f;
            margin: 0 0 10px 0;
        }
        .receipt-header h2 {
            color: #333;
            margin: 0;
            font-size: 18px;
        }
        .receipt-section {
            margin-bottom: 30px;
        }
        .receipt-section h3 {
            color: #d32f2f;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .receipt-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .info-item {
            margin-bottom: 10px;
        }
        .info-label {
            font-weight: bold;
            color: #666;
            display: block;
            margin-bottom: 5px;
        }
        .info-value {
            color: #333;
        }
        .receipt-items {
            margin-bottom: 30px;
        }
        .receipt-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #ddd;
        }
        .receipt-item:last-child {
            border-bottom: none;
        }
        .item-details {
            flex: 1;
        }
        .item-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .item-quantity {
            color: #666;
            font-size: 14px;
        }
        .item-price {
            font-weight: bold;
            color: #d32f2f;
            font-size: 18px;
        }
        .receipt-total {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 3px solid #d32f2f;
            text-align: right;
        }
        .total-label {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .total-amount {
            font-size: 32px;
            font-weight: bold;
            color: #d32f2f;
        }
        .signature-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #ddd;
        }
        .signature-line {
            border-top: 2px solid #333;
            margin-top: 60px;
            padding-top: 5px;
            text-align: center;
        }
        .signature-label {
            font-size: 14px;
            color: #666;
        }
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
        }
        .error {
            text-align: center;
            padding: 40px;
            color: #d32f2f;
            font-size: 18px;
        }
        /* Order Confirmed Modal Styles */
        #order-confirmed-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        #order-confirmed-modal.show {
            opacity: 1;
        }
        
        #order-confirmed-modal .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        
        #order-confirmed-modal .modal-content {
            position: relative;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            z-index: 10001;
        }
        
        #order-confirmed-modal.show .modal-content {
            transform: scale(1);
        }
        
        #order-confirmed-modal .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #ddd;
        }
        
        #order-confirmed-modal .modal-header h3 {
            margin: 0;
            color: #333;
            font-size: 24px;
            font-family: 'Gabriola', 'Cormorant Garamond', serif;
        }
        
        #order-confirmed-modal .modal-body {
            padding: 25px;
        }
        
        #order-confirmed-modal .modal-body p {
            margin: 0;
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            font-family: 'Gabriola', 'Cormorant Garamond', serif;
        }
        
        #order-confirmed-modal .modal-footer {
            padding: 15px 25px;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        @media print {
            .nav-buttons {
                display: none;
            }
            body {
                background-color: white;
            }
        }
    </style>
</head>
<body>
    <div class="titleDiv">
        <h1>Piero's Pizzeria</h1>
        <h2>Order Receipt</h2>
    </div>
    <div class="nav-buttons">
        <button class="button" onclick="window.location.href='index.html'">Home</button>
        <button class="button" onclick="window.location.href='menuMainPage.html'">Menu</button>
        <button class="button" onclick="window.location.href='cart.html'">Cart</button>
        <button class="button" onclick="window.print()">Print Receipt</button>
    </div>
    <script src="js/navigation.js"></script>
    
    <div class="receipt-container" id="receipt-container">
        <div class="loading">Loading receipt...</div>
    </div>

    <script src="js/modal.js"></script>
    <script src="js/app.js"></script>
    <script>
        function showOrderConfirmedModal() {
            // Remove existing modal if any
            const existingModal = document.getElementById('order-confirmed-modal');
            if (existingModal) {
                existingModal.remove();
            }

            const modal = document.createElement('div');
            modal.id = 'order-confirmed-modal';
            modal.innerHTML = `
                <div class="modal-overlay" onclick="closeOrderConfirmedModal()"></div>
                <div class="modal-content" style="text-align: center;">
                    <div class="modal-header">
                        <h3 style="color: #4caf50; margin: 0;">Order Confirmed!</h3>
                    </div>
                    <div class="modal-body">
                        <p style="font-size: 18px; margin: 20px 0;">Your order has been confirmed and will be processed shortly.</p>
                        <p style="margin: 10px 0;">Thank you for your order!</p>
                    </div>
                    <div class="modal-footer" style="justify-content: center;">
                        <button class="button" onclick="window.location.href='menuMainPage.html'" 
                                style="border: 2px outset #d32f2f; color: black; padding: 12px 30px; text-align: center; text-decoration: none; display: inline-block; font-size: 18px; cursor: pointer; background-color: white; transition: background-color 0.3s; border-radius: 5px; font-family: 'Gabriola', 'Cormorant Garamond', serif;">
                            Back to Menu
                        </button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.classList.add('show');
            }, 10);
        }
        
        function closeOrderConfirmedModal() {
            const modal = document.getElementById('order-confirmed-modal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 300);
            }
        }
        
        function confirmSignature() {
            const signatureInput = document.getElementById('receiptSignature');
            if (!signatureInput) return;
            
            const signature = signatureInput.value.trim();
            if (!signature || signature.length === 0) {
                showError('Please enter your full name to sign the receipt');
                return;
            }
            
            // Show order confirmed modal
            showOrderConfirmedModal();
        }
    </script>
    <script>
        async function loadReceipt() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId');

            if (!orderId) {
                document.getElementById('receipt-container').innerHTML = `
                    <div class="error">Order ID not found. Please check your order details.</div>
                `;
                return;
            }

            try {
                const response = await fetch(`/api/order/${orderId}`);
                const result = await response.json();

                if (!result.success) {
                    document.getElementById('receipt-container').innerHTML = `
                        <div class="error">${result.message || 'Failed to load receipt'}</div>
                    `;
                    return;
                }

                const order = result.order;
                const customer = result.customer;
                const items = result.items;

                let html = `
                    <div class="receipt-header">
                        <h1>PIERO'S PIZZERIA</h1>
                        <h2>Order Receipt</h2>
                        <p>Order #${order.id}</p>
                        <p>Date: ${new Date(order.orderDate).toLocaleString()}</p>
                    </div>

                    <div class="receipt-section">
                        <h3>Customer Information</h3>
                        <div class="receipt-info">
                            <div class="info-item">
                                <span class="info-label">Name:</span>
                                <span class="info-value">${customer.fullName}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Phone:</span>
                                <span class="info-value">${customer.phoneNumber || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Email:</span>
                                <span class="info-value">${customer.email}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Order Type:</span>
                                <span class="info-value" style="text-transform: capitalize; font-weight: bold; color: #d32f2f;">${order.orderType}</span>
                            </div>
                        </div>
                        ${order.orderType === 'delivery' ? `
                        <div class="info-item" style="margin-top: 15px;">
                            <span class="info-label">Delivery Address:</span>
                            <span class="info-value">${order.deliveryAddress}</span>
                        </div>
                        ` : ''}
                    </div>

                    <div class="receipt-section">
                        <h3>Order Items</h3>
                        <div class="receipt-items">
                `;

                items.forEach(item => {
                    html += `
                        <div class="receipt-item">
                            <div class="item-details">
                                <div class="item-name">${item.name}</div>
                                <div class="item-quantity">Quantity: ${item.quantity}</div>
                            </div>
                            <div class="item-price">${formatPrice(item.subtotal)}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>

                    <div class="receipt-total">
                        <div class="total-label">Total Amount:</div>
                        <div class="total-amount">${formatPrice(order.total)}</div>
                    </div>
                `;

                // Add signature section if paid by credit card
                if (order.paymentCardType) {
                    html += `
                        <div class="signature-section">
                            <div class="info-item">
                                <span class="info-label">Payment Method:</span>
                                <span class="info-value">${order.paymentCardType} ending in ${order.paymentCardLast4}</span>
                            </div>
                            <div style="margin-top: 40px;">
                                <label for="receiptSignature" style="font-weight: bold; color: #666; display: block; margin-bottom: 10px;">
                                    Customer Signature (Enter your full name):
                                </label>
                                <input type="text" id="receiptSignature" placeholder="Enter your full name" 
                                       style="width: 100%; padding: 10px; border: 2px solid #333; border-radius: 4px; font-size: 16px; font-family: 'Gabriola', 'Cormorant Garamond', serif; margin-bottom: 20px;">
                                <div class="signature-line" style="margin-top: 60px;">
                                    <div class="signature-label">Signed: <span id="signatureName" style="font-weight: bold; color: #333;"></span></div>
                                </div>
                                <div style="margin-top: 30px; text-align: center;">
                                    <button id="confirmSignatureBtn" class="button" 
                                            onclick="confirmSignature()">
                                        Confirm Signature
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    // If no payment card type, show back to menu button immediately
                    html += `
                        <div style="margin-top: 40px; text-align: center;">
                            <button class="button" onclick="window.location.href='menuMainPage.html'" 
                                    style="background-color: #4caf50; color: white; padding: 15px 40px; font-size: 18px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">
                                Back to Menu
                            </button>
                        </div>
                    `;
                }

                document.getElementById('receipt-container').innerHTML = html;
                
                // Add signature handler
                const signatureInput = document.getElementById('receiptSignature');
                if (signatureInput) {
                    signatureInput.addEventListener('input', function() {
                        const signatureName = document.getElementById('signatureName');
                        if (signatureName) {
                            signatureName.textContent = this.value || '';
                        }
                    });
                    
                    // Allow Enter key to confirm signature
                    signatureInput.addEventListener('keypress', function(e) {
                        if (e.key === 'Enter') {
                            confirmSignature();
                        }
                    });
                }
            } catch (error) {
                console.error('Error loading receipt:', error);
                document.getElementById('receipt-container').innerHTML = `
                    <div class="error">Failed to load receipt. Please try again.</div>
                `;
            }
        }

        // Load receipt when page loads
        window.addEventListener('DOMContentLoaded', loadReceipt);
    </script>
</body>
</html>
